<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>호원앤컴퍼니 · Pre-Interview Survey</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" />
<style>
  :root{
    --bg:        #F4EEE2;
    --bg-2:      #EFE7D6;
    --surface:   #FFFFFF;
    --surface-2: #FBF7EE;
    --ink:       #2F2A23;
    --ink-2:     #5C5246;
    --ink-3:     #8B7F70;
    --line:      #E6DCC9;
    --line-2:    #D9CDB6;
    --terra:     #C46A4A;
    --terra-2:   #E89A7C;
    --terra-bg:  #F4D9CB;
    --sage:      #7A8C6A;
    --sage-2:    #A8B898;
    --sage-bg:   #DCE3D0;
    --cream:     #F0E6CF;
    --warn:      #B85C3D;
    --radius:    14px;
    --radius-lg: 22px;
    --shadow-1:  0 1px 0 rgba(60,40,20,.04), 0 1px 2px rgba(60,40,20,.04);
    --shadow-2:  0 1px 0 rgba(60,40,20,.04), 0 6px 24px -10px rgba(80,55,30,.18);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'SUIT Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    letter-spacing: -0.01em;
  }

  /* — Background texture: subtle warm paper — */
  body::before{
    content:"";
    position: fixed; inset: 0;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(196,106,74,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(122,140,106,.08), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app{ position: relative; z-index: 1; }

  /* — Sticky progress — */
  .progress-bar{
    position: sticky; top: 0; z-index: 50;
    background: rgba(244, 238, 226, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .progress-bar__inner{
    max-width: 720px; margin: 0 auto;
    padding: 14px 24px;
    display:flex; align-items:center; gap:14px;
  }
  .progress-bar__label{
    font-size: 12.5px; color: var(--ink-2);
    flex-shrink:0; font-weight: 500;
    letter-spacing: 0.02em;
  }
  .progress-bar__track{
    flex:1; height: 6px; background: var(--bg-2);
    border-radius: 999px; overflow:hidden;
    box-shadow: inset 0 1px 2px rgba(80,55,30,.08);
  }
  .progress-bar__fill{
    height: 100%; background: linear-gradient(90deg, var(--sage) 0%, var(--terra) 100%);
    border-radius: 999px;
    transition: width .45s cubic-bezier(.22,.61,.36,1);
  }
  .progress-bar__pct{
    font-size: 13px; color: var(--ink); font-weight:500;
    font-variant-numeric: tabular-nums;
    min-width: 38px; text-align:right;
  }

  /* — Page container — */
  .page{
    max-width: 720px; margin: 0 auto;
    padding: 56px 24px 96px;
  }

  /* — Header — */
  .hero{ text-align: center; margin-bottom: 56px; }
  .hero__mark{
    display:inline-flex; align-items:center; gap:8px;
    padding: 6px 14px;
    border: 1px solid var(--line-2);
    background: var(--surface-2);
    border-radius: 999px;
    font-size: 12.5px; color: var(--ink-2);
    margin-bottom: 24px;
    letter-spacing: 0.06em;
  }
  .hero__dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--sage);
    box-shadow: 0 0 0 3px rgba(122,140,106,.18);
  }
  .hero__brand{
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 500;
    letter-spacing: -0.025em;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .hero__brand-en{
    color: var(--terra);
    font-style: italic;
    font-weight: 400;
  }
  .hero__sub{
    font-size: 15px;
    color: var(--ink-2);
    margin: 0;
    letter-spacing: 0.02em;
  }
  .hero__ornament{
    width: 56px; height: 1px;
    background: var(--line-2);
    margin: 32px auto 0;
    position: relative;
  }
  .hero__ornament::before,
  .hero__ornament::after{
    content:""; position:absolute; top:50%;
    width:4px; height:4px; border-radius:50%;
    background: var(--line-2); transform: translateY(-50%);
  }
  .hero__ornament::before{ left:-10px; }
  .hero__ornament::after{ right:-10px; }

  /* — Section labels — */
  .section-label{
    display:flex; align-items:center; gap:10px;
    font-size: 12px; color: var(--ink-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 18px;
    font-weight: 500;
  }
  .section-label__num{
    font-family: 'SUIT Variable', sans-serif;
    color: var(--terra);
    font-weight: 500;
  }
  .section-label__line{
    flex:1; height:1px; background: var(--line);
  }

  /* — Intro card (letter) — */
  .letter{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    box-shadow: var(--shadow-2);
    position: relative;
    overflow: hidden;
  }
  .letter::before{
    content:"";
    position:absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--terra) 0%, var(--cream) 50%, var(--sage) 100%);
  }
  .letter__greeting{
    font-size: 18px; font-weight: 500;
    color: var(--ink);
    margin: 0 0 18px;
  }
  .letter__body{
    color: var(--ink-2);
    font-size: 15.5px;
    line-height: 1.8;
    margin: 0;
    text-wrap: pretty;
  }
  .letter__body em{
    font-style: normal;
    color: var(--terra);
    font-weight: 500;
  }
  .letter__signoff{
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px dashed var(--line);
    font-size: 14px;
    color: var(--ink-3);
    display:flex; justify-content:space-between; align-items:baseline;
    gap: 12px; flex-wrap: wrap;
  }
  .letter__signoff strong{
    color: var(--ink-2);
    font-weight: 500;
  }

  /* — Tips — */
  .tips{
    margin-top: 22px;
    display:grid; gap: 10px;
  }
  .tip{
    display:flex; align-items:flex-start; gap: 12px;
    padding: 14px 16px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 14px;
    color: var(--ink-2);
  }
  .tip__icon{
    width: 22px; height: 22px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--sage-bg);
    color: var(--sage);
    display:inline-flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight: 500;
    margin-top: 1px;
  }

  /* — Block spacing — */
  .block{ margin-top: 64px; }

  /* — Environment cards — */
  .env-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 720px){
    .env-grid{ grid-template-columns: repeat(4, 1fr); }
  }
  .env-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 18px 20px;
    display:flex; flex-direction:column; gap: 10px;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .env-card:hover{
    transform: translateY(-2px);
    border-color: var(--line-2);
    box-shadow: var(--shadow-2);
  }
  .env-card__top{
    display:flex; align-items:center; justify-content:space-between;
  }
  .env-card__tag{
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .env-card__pin{
    width: 18px; height: 18px;
    border-radius: 50%;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .env-card__value{
    font-size: 30px; font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .env-card__value-unit{
    font-size: 15px; color: var(--ink-3);
    font-weight: 400;
    margin-left: 2px;
  }
  .env-card__label{
    font-size: 13.5px;
    color: var(--ink-2);
    margin-top: auto;
    padding-top: 4px;
  }
  .env-card__note{
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .env-card--terra .env-card__pin{ background: var(--terra-bg); color: var(--terra); }
  .env-card--sage  .env-card__pin{ background: var(--sage-bg);  color: var(--sage);  }
  .env-card--cream .env-card__pin{ background: var(--cream);    color: var(--warn);  }
  .env-card--terra .env-card__value{ color: var(--terra); }
  .env-card--sage  .env-card__value{ color: var(--sage); }
  .env-card--cream .env-card__value{ color: var(--warn); }

  /* — Form — */
  .form{ display:flex; flex-direction: column; gap: 28px; }

  .field{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px 28px 24px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field:focus-within{
    border-color: var(--terra-2);
    box-shadow: 0 0 0 4px rgba(196,106,74,.08);
  }
  @media (max-width: 480px){
    .field{ padding: 22px 20px 20px; }
  }

  .field__head{
    display:flex; align-items:flex-start; gap: 14px;
    margin-bottom: 14px;
  }
  .field__num{
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-2);
    display:inline-flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .field--done .field__num{
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
  }
  .field__title{
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.5;
    margin: 4px 0 0;
    flex: 1;
  }
  .field__required{
    display:inline-block;
    margin-left: 6px;
    color: var(--terra);
    font-weight: 500;
  }
  .field__optional{
    display:inline-block;
    margin-left: 8px;
    padding: 1px 8px;
    font-size: 11px;
    color: var(--ink-3);
    background: var(--bg-2);
    border-radius: 999px;
    vertical-align: middle;
    font-weight: 400;
  }
  .field__hint{
    margin: 0 0 14px;
    padding: 12px 14px;
    background: var(--cream);
    border-left: 3px solid var(--terra-2);
    border-radius: 6px;
    color: var(--ink-2);
    font-size: 13.5px;
    line-height: 1.6;
  }

  /* — Inputs — */
  .input, .textarea{
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color .15s ease, background .15s ease;
    outline: none;
    font-weight: 400;
    line-height: 1.6;
  }
  .input::placeholder, .textarea::placeholder{
    color: var(--ink-3);
    opacity: 0.7;
  }
  .input:focus, .textarea:focus{
    border-color: var(--terra-2);
    background: #fff;
  }
  .textarea{
    min-height: 130px;
    resize: vertical;
  }

  .input--date{
    font-variant-numeric: tabular-nums;
    color-scheme: light;
  }

  .field__footer{
    display:flex; justify-content: space-between; align-items: center;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .counter{
    font-variant-numeric: tabular-nums;
  }
  .counter strong{
    color: var(--ink-2);
    font-weight: 500;
  }

  /* — External link mention — */
  .field__link{
    display:inline-flex; align-items:center; gap: 6px;
    padding: 8px 12px;
    background: var(--sage-bg);
    color: var(--sage);
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    text-decoration: none;
    margin: 0 0 14px;
    border: 1px solid rgba(122,140,106,.25);
    transition: background .15s ease;
  }
  .field__link:hover{ background: #d1dabf; }

  /* — Submit — */
  .submit-area{
    margin-top: 48px;
    text-align: center;
  }
  .submit-area__line{
    font-size: 14px;
    color: var(--ink-3);
    margin-bottom: 18px;
  }
  .submit{
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit;
    background: var(--terra);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    padding: 16px 48px;
    border-radius: 999px;
    min-width: 220px;
    display:inline-flex; align-items:center; justify-content:center; gap: 10px;
    box-shadow: 0 10px 24px -8px rgba(196,106,74,.5);
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
  }
  .submit:hover:not(:disabled){
    background: #b25e3f;
    transform: translateY(-1px);
  }
  .submit:active:not(:disabled){ transform: translateY(0); }
  .submit:disabled{
    background: #d2bfb1;
    cursor: not-allowed;
    box-shadow: none;
  }
  .submit__spinner{
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .submit-help{
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .submit-help--warn{ color: var(--warn); }

  /* — Footer — */
  .footer{
    margin-top: 80px;
    padding: 32px 0 0;
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--ink-3);
    font-size: 13px;
    line-height: 1.7;
  }
  .footer strong{
    color: var(--ink-2); font-weight: 500;
    display:block; margin-bottom: 2px;
  }

  /* — Modal — */
  .modal-backdrop{
    position: fixed; inset: 0;
    background: rgba(47, 42, 35, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    z-index: 100;
    animation: fadeIn .25s ease;
  }
  .modal{
    background: var(--surface);
    border-radius: var(--radius-lg);
    max-width: 440px; width: 100%;
    padding: 40px 32px 32px;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(60,40,20,.4);
    animation: pop .35s cubic-bezier(.22,.61,.36,1);
    position: relative;
    overflow: hidden;
  }
  .modal::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background: linear-gradient(90deg, var(--terra) 0%, var(--cream) 50%, var(--sage) 100%);
  }
  .modal__check{
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--sage-bg);
    color: var(--sage);
    display:flex; align-items:center; justify-content:center;
  }
  .modal__title{
    font-size: 20px; font-weight: 500;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .modal__body{
    font-size: 14.5px;
    color: var(--ink-2);
    line-height: 1.7;
    margin: 0 0 24px;
  }
  .modal__close{
    appearance: none; border: 1px solid var(--line-2);
    background: var(--surface-2);
    color: var(--ink);
    font-family: inherit; font-weight: 500;
    padding: 10px 24px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s ease;
  }
  .modal__close:hover{ background: var(--cream); }

  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes pop{
    from{ opacity: 0; transform: scale(.94) translateY(8px); }
    to  { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* — Error state — */
  .field.field--error{ border-color: rgba(184,92,61,.5); }
  .field.field--error .field__num{
    background: rgba(184,92,61,.12);
    border-color: rgba(184,92,61,.3);
    color: var(--warn);
  }
  .field__error{
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--warn);
  }

  /* — Reduce motion — */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;

    /* — Question definitions — */
    const QUESTIONS = [
      {
        id: 'name',
        kind: 'text',
        required: true,
        title: '귀하의 성함을 적어주세요',
        placeholder: '예) 홍길동',
      },
      {
        id: 'intro',
        kind: 'textarea',
        required: true,
        title: '귀하가 어떤 사람인지 소개해 주십시오',
        placeholder: '편하게 자신을 소개해 주세요. 어떤 가치관을 가지고 계신지, 어떤 일을 좋아하시는지 등 무엇이든 좋습니다.',
      },
      {
        id: 'birth',
        kind: 'date',
        required: true,
        title: '귀하의 생년월일을 적어주십시오',
      },
      {
        id: 'best',
        kind: 'textarea',
        required: true,
        title: '이전 업무 경험 중 가장 성과가 좋았던 때의 스토리를 알려주십시오',
        placeholder: '편안하게 그때의 이야기를 들려주세요.',
        hint: '어떤 성과가 있었는지, 그 성과는 무엇 때문에 결과가 좋았던 것인지, 그 성과가 자신을 어떻게 변화시켰는지 기술해 주십시오.',
      },
      {
        id: 'weakness',
        kind: 'textarea',
        required: true,
        title: '본인의 단점은 무엇이며, 이를 어떻게 극복하고 있거나 극복할 계획인지 기술해 주십시오',
        placeholder: '솔직하게 작성해 주시면 좋습니다.',
      },
      {
        id: 'motivation',
        kind: 'textarea',
        required: true,
        title: '호원앤컴퍼니에 지원한 이유는 무엇이며 어떤 기여를 할 수 있습니까?',
        placeholder: '지원 동기와 함께, 본인의 어떤 강점을 발휘하실 수 있는지 알려주세요.',
      },
      {
        id: 'feedback',
        kind: 'textarea',
        required: false,
        title: '공개된 당사 정보 중에서 우리가 변경을 해야 하거나 개선을 해야 하는 부분이 있다면 말씀해주십시오',
        placeholder: '편하게 의견을 주세요. 어떤 의견도 환영합니다.',
      },
      {
        id: 'blog',
        kind: 'textarea',
        required: true,
        title: '온라인에 노출된 호원앤컴퍼니의 자사 광고에 대해, 부족하거나 변경해야 할 부분을 검토하고 고견을 주시기 바랍니다',
        placeholder: '블로그 콘텐츠, 광고 카피, 비주얼, 메시지 등 자유롭게 의견을 남겨주세요.',
        link: {
          href: 'https://blog.naver.com/caregn',
          label: '호원앤컴퍼니 블로그 열어보기',
        },
      },
    ];

    /* — Icons — */
    const Icon = {
      Calendar: () => (
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
        </svg>
      ),
      Clock: () => (
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
      ),
      Moon: () => (
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>
        </svg>
      ),
      Cup: () => (
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 6h12v6a6 6 0 0 1-12 0V6z"/><path d="M17 8h2a2 2 0 0 1 0 4h-2"/><path d="M4 21h14"/>
        </svg>
      ),
      ArrowUp: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M7 17 17 7M9 7h8v8"/>
        </svg>
      ),
      Check: () => (
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12.5l4.5 4.5L19 7"/>
        </svg>
      ),
    };

    /* — Section label — */
    function SectionLabel({ num, children }){
      return (
        <div className="section-label">
          <span className="section-label__num">{num}</span>
          <span>{children}</span>
          <span className="section-label__line" />
        </div>
      );
    }

    /* — Environment cards data — */
    const ENV_CARDS = [
      { tone: 'terra', value: '5', unit: '년', label: '평균 근속',     note: '오래 함께 일합니다',  icon: <Icon.Calendar /> },
      { tone: 'sage',  value: '37', unit: '시간', label: '주 근무 시간', note: '금요일은 오후 4시 퇴근', icon: <Icon.Clock /> },
      { tone: 'cream', value: '거의', unit: '없음', label: '야간 근무',   note: '저녁이 있는 일상',    icon: <Icon.Moon /> },
      { tone: 'cream', value: '강요', unit: '없음', label: '회식 문화',   note: '자율적인 분위기',    icon: <Icon.Cup /> },
    ];

    /* — Main App — */
    function App(){
      const initial = useMemo(() => Object.fromEntries(QUESTIONS.map(q => [q.id, ''])), []);
      const [values, setValues] = useState(initial);
      const [submitting, setSubmitting] = useState(false);
      const [done, setDone] = useState(false);
      const [showErrors, setShowErrors] = useState(false);
      const formRef = useRef(null);

      const setVal = (id, v) => setValues(prev => ({ ...prev, [id]: v }));

      const requiredQs = QUESTIONS.filter(q => q.required);
      const filledRequired = requiredQs.filter(q => (values[q.id] || '').trim().length > 0).length;
      const pct = Math.round((filledRequired / requiredQs.length) * 100);
      const allRequiredDone = filledRequired === requiredQs.length;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!allRequiredDone){
          setShowErrors(true);
          // scroll to first empty required
          const firstEmpty = requiredQs.find(q => !(values[q.id] || '').trim());
          if (firstEmpty){
            const el = document.getElementById('field-' + firstEmpty.id);
            if (el){
              const top = el.getBoundingClientRect().top + window.pageYOffset - 80;
              window.scrollTo({ top, behavior: 'smooth' });
              setTimeout(() => {
                const input = el.querySelector('input, textarea');
                if (input) input.focus({ preventScroll: true });
              }, 400);
            }
          }
          return;
        }
        setSubmitting(true);
        setTimeout(() => {
          setSubmitting(false);
          setDone(true);
        }, 1600);
      };

      const resetAfterDone = () => {
        setDone(false);
        setValues(initial);
        setShowErrors(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="app">
          {/* Sticky progress */}
          <div className="progress-bar" role="progressbar" aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100">
            <div className="progress-bar__inner">
              <span className="progress-bar__label">설문 진행률</span>
              <div className="progress-bar__track">
                <div className="progress-bar__fill" style={{ width: pct + '%' }} />
              </div>
              <span className="progress-bar__pct">{pct}%</span>
            </div>
          </div>

          <main className="page">

            {/* Hero */}
            <header className="hero">
              <span className="hero__mark">
                <span className="hero__dot" />
                Pre-Interview Survey
              </span>
              <h1 className="hero__brand">
                호원앤컴퍼니<span className="hero__brand-en"> · Howon &amp; Company</span>
              </h1>
              <p className="hero__sub">지원자 여러분을 한 걸음 더 알아가기 위한 짧은 인사입니다.</p>
              <div className="hero__ornament" />
            </header>

            {/* Intro */}
            <section>
              <SectionLabel num="01">지원자 여러분께</SectionLabel>
              <article className="letter">
                <p className="letter__greeting">반갑습니다, 그리고 감사합니다.</p>
                <p className="letter__body">
                  먼저, 저희 <em>호원앤컴퍼니</em>에 소중한 지원서를 보내주셔서 진심으로 감사드립니다.
                  <br /><br />
                  이 설문은 지원자 여러분의 역량과 강점을 보다 폭넓게 파악하고,
                  호원앤컴퍼니와의 적합성을 함께 고민하기 위한 과정입니다.
                  성실히 응답해 주시면 채용 과정에 큰 도움이 될 것입니다.
                </p>
                <div className="letter__signoff">
                  <span>편안한 마음으로, 천천히 답변해 주세요.</span>
                  <strong>채용 담당자 드림</strong>
                </div>

                <div className="tips">
                  <div className="tip">
                    <span className="tip__icon">✓</span>
                    <span>정답은 없습니다. 솔직하고 구체적으로 작성해 주세요.</span>
                  </div>
                  <div className="tip">
                    <span className="tip__icon">?</span>
                    <span>궁금하신 점이 있다면 언제든 편하게 문의해 주세요.</span>
                  </div>
                  <div className="tip">
                    <span className="tip__icon">♥</span>
                    <span>답변해 주신 모든 정보는 채용 목적으로만 활용됩니다.</span>
                  </div>
                </div>
              </article>
            </section>

            {/* Environment */}
            <section className="block">
              <SectionLabel num="02">함께 일하게 될 환경</SectionLabel>
              <div className="env-grid">
                {ENV_CARDS.map((c, i) => (
                  <div key={i} className={`env-card env-card--${c.tone}`}>
                    <div className="env-card__top">
                      <span className="env-card__tag">0{i+1}</span>
                      <span className="env-card__pin">{c.icon}</span>
                    </div>
                    <div className="env-card__value">
                      {c.value}
                      <span className="env-card__value-unit">{c.unit}</span>
                    </div>
                    <div className="env-card__label">{c.label}</div>
                    <div className="env-card__note">{c.note}</div>
                  </div>
                ))}
              </div>
            </section>

            {/* Form */}
            <section className="block">
              <SectionLabel num="03">설문</SectionLabel>
              <form className="form" ref={formRef} onSubmit={handleSubmit} noValidate>
                {QUESTIONS.map((q, idx) => {
                  const v = values[q.id] || '';
                  const filled = v.trim().length > 0;
                  const isError = showErrors && q.required && !filled;
                  const num = String(idx + 1).padStart(2, '0');
                  return (
                    <div
                      key={q.id}
                      id={'field-' + q.id}
                      className={`field${filled ? ' field--done' : ''}${isError ? ' field--error' : ''}`}
                    >
                      <div className="field__head">
                        <span className="field__num">{filled ? '✓' : num}</span>
                        <h3 className="field__title">
                          Q{idx+1}. {q.title}
                          {q.required
                            ? <span className="field__required" aria-label="필수">*</span>
                            : <span className="field__optional">선택</span>}
                        </h3>
                      </div>

                      {q.hint && <p className="field__hint">💡 {q.hint}</p>}

                      {q.link && (
                        <a className="field__link" href={q.link.href} target="_blank" rel="noopener noreferrer">
                          {q.link.label} <Icon.ArrowUp />
                        </a>
                      )}

                      {q.kind === 'text' && (
                        <input
                          className="input"
                          type="text"
                          value={v}
                          onChange={e => setVal(q.id, e.target.value)}
                          placeholder={q.placeholder}
                          maxLength={60}
                        />
                      )}

                      {q.kind === 'date' && (
                        <input
                          className="input input--date"
                          type="date"
                          value={v}
                          onChange={e => setVal(q.id, e.target.value)}
                          max="2010-12-31"
                          min="1940-01-01"
                        />
                      )}

                      {q.kind === 'textarea' && (
                        <textarea
                          className="textarea"
                          value={v}
                          onChange={e => setVal(q.id, e.target.value)}
                          placeholder={q.placeholder}
                          rows={5}
                        />
                      )}

                      {q.kind === 'textarea' && (
                        <div className="field__footer">
                          {isError
                            ? <span className="field__error">필수 항목입니다.</span>
                            : <span>편안한 마음으로 작성해 주세요.</span>}
                          <span className="counter">
                            <strong>{v.length}</strong>자
                          </span>
                        </div>
                      )}

                      {q.kind !== 'textarea' && isError && (
                        <div className="field__footer">
                          <span className="field__error">필수 항목입니다.</span>
                          <span />
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* Submit */}
                <div className="submit-area">
                  <div className="submit-area__line">
                    답변해 주셔서 감사합니다.<br />
                    아래 버튼을 눌러 제출해 주세요.
                  </div>
                  <button type="submit" className="submit" disabled={submitting}>
                    {submitting
                      ? (<><span className="submit__spinner" /> 제출 중…</>)
                      : '설문 제출하기'}
                  </button>
                  {showErrors && !allRequiredDone && (
                    <div className="submit-help submit-help--warn">
                      필수 항목 {requiredQs.length - filledRequired}개가 비어 있어요.
                    </div>
                  )}
                  {!showErrors && (
                    <div className="submit-help">
                      필수 {requiredQs.length}문항 · {filledRequired} / {requiredQs.length} 작성됨
                    </div>
                  )}
                </div>
              </form>
            </section>

            {/* Footer */}
            <footer className="footer">
              <strong>© 호원앤컴퍼니</strong>
              의료기관 전문 마케팅 컨설팅<br />
              고객 확산 엔진 구축
            </footer>
          </main>

          {/* Modal */}
          {done && (
            <div className="modal-backdrop" onClick={resetAfterDone}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div className="modal__check"><Icon.Check /></div>
                <h2 className="modal__title">소중한 답변, 잘 받았습니다.</h2>
                <p className="modal__body">
                  {values.name && <><strong style={{color:'var(--terra)', fontWeight:500}}>{values.name}</strong>님, </>}
                  설문을 제출해 주셔서 진심으로 감사드립니다.<br />
                  답변은 채용 과정에 소중하게 활용하겠습니다.<br />
                  곧 채용 담당자가 연락드리겠습니다.
                </p>
                <button className="modal__close" onClick={resetAfterDone}>닫기</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
